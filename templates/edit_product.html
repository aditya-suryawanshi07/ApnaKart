<!DOCTYPE html>
<html>

<head>

    <title>Edit Product - ApnaKart</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a href="/" class="navbar-brand fw-bold">
            🛒 ApnaKart Admin
        </a>

        <a href="{{ url_for('admin') }}" class="btn btn-outline-light">
            Back to Admin
        </a>

    </div>

</nav>

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="mb-4">
                        Edit Product
                    </h2>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Product Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                value="{{ product.name }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Price
                            </label>

                            <input
                                type="number"
                                name="price"
                                class="form-control"
                                value="{{ product.price }}"
                                min="0"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Image Filename
                            </label>

                            <input
                                type="text"
                                name="image"
                                class="form-control"
                                value="{{ product.image }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="4"
                                required>{{ product.description }}</textarea>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Category
                            </label>

                            <select
                                name="category"
                                class="form-select"
                                required>

                                <option value="Mobiles"
                                    {% if product.category == "Mobiles" %}selected{% endif %}>
                                    Mobiles
                                </option>

                                <option value="Laptops"
                                    {% if product.category == "Laptops" %}selected{% endif %}>
                                    Laptops
                                </option>

                                <option value="Electronics"
                                    {% if product.category == "Electronics" %}selected{% endif %}>
                                    Electronics
                                </option>

                                <option value="Fashion"
                                    {% if product.category == "Fashion" %}selected{% endif %}>
                                    Fashion
                                </option>

                                <option value="Home"
                                    {% if product.category == "Home" %}selected{% endif %}>
                                    Home
                                </option>

                            </select>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Rating
                            </label>

                            <input
                                type="number"
                                name="rating"
                                class="form-control"
                                value="{{ product.rating }}"
                                min="0"
                                max="5"
                                step="0.1"
                                required>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Save Changes

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
