<!DOCTYPE html>
<html>

<head>

    <title>Add Product - ApnaKart</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a href="/" class="navbar-brand fw-bold">
                🛒 ApnaKart Admin
            </a>

            <a href="{{ url_for('admin') }}" class="btn btn-outline-light">
                Back to Admin
            </a>

        </div>

    </nav>

    <div class="container mt-5 mb-5">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <div class="card shadow">

                    <div class="card-body p-4">

                        <h2 class="mb-4">
                            Add New Product
                        </h2>

                        <form method="POST" enctype="multipart/form-data">

                            <div class="mb-3">

                                <label class="form-label">
                                    Product Name
                                </label>

                                <input type="text" name="name" class="form-control" required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Price
                                </label>

                                <input type="number" name="price" class="form-control" min="0" required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Image Filename
                                </label>

                                <input type="file" name="image" class="form-control"
                                    accept="image/png, image/jpeg, image/jpg, image/webp" required>

                                <div class="form-text">
                                    Choose a JPG, PNG, JPEG, or WEBP image.
                                </div>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Description
                                </label>

                                <textarea name="description" class="form-control" rows="4" required></textarea>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Category
                                </label>

                                <select name="category" class="form-select" required>

                                    <option value="">
                                        Select category
                                    </option>

                                    <option value="Mobiles">
                                        Mobiles
                                    </option>

                                    <option value="Laptops">
                                        Laptops
                                    </option>

                                    <option value="Electronics">
                                        Electronics
                                    </option>

                                    <option value="Fashion">
                                        Fashion
                                    </option>

                                    <option value="Home">
                                        Home
                                    </option>

                                </select>

                            </div>

                            <div class="mb-4">

                                <label class="form-label">
                                    Rating
                                </label>

                                <input type="number" name="rating" class="form-control" min="0" max="5" step="0.1"
                                    value="4.5" required>

                            </div>

                            <button type="submit" class="btn btn-success w-100">

                                Add Product

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
